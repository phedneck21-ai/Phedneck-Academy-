<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração — Phedneck Academy</title>
<link rel="stylesheet" href="styles.css">
<style>
body{background:#f4f6f8}.admin-wrap{width:min(1180px,94%);margin:35px auto}
.admin-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
.admin-header h1{margin:0}.admin-header p{color:#64748b}
.admin-actions{display:flex;gap:10px;flex-wrap:wrap}
.admin-btn{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:800;background:#0a1020;color:#fff}
.admin-btn.gold{background:#f2c400;color:#111}.admin-btn.danger{background:#b91c1c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.stat{background:#fff;padding:20px;border-radius:14px;box-shadow:0 5px 20px #0000000d}.stat small{color:#64748b}.stat strong{display:block;font-size:30px;margin-top:6px}
.panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 5px 20px #0000000d}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{padding:11px;border:1px solid #d7dee8;border-radius:8px;font:inherit}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5e7eb;font-size:14px}th{background:#f8fafc}
.status{border:0;border-radius:7px;padding:7px;font-weight:700}.delete{border:0;background:#fee2e2;color:#991b1b;border-radius:6px;padding:7px;cursor:pointer}
.empty{text-align:center;padding:40px;color:#64748b}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.admin-header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="admin-wrap">
  <header class="admin-header">
    <div>
      <p class="eyebrow">PHEDNECK ACADEMY</p>
      <h1>Gestão de Inscrições</h1>
      <p>Consulte, atualize e organize as inscrições recebidas pelo site.</p>
    </div>
    <div class="admin-actions">
      <a class="admin-btn gold" href="index.html">← Voltar ao site</a>
      <button class="admin-btn" id="exportBtn">Exportar CSV</button>
      <button class="admin-btn danger" id="clearBtn">Apagar todas</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><small>Total de inscrições</small><strong id="total">0</strong></div>
    <div class="stat"><small>Novas</small><strong id="novas">0</strong></div>
    <div class="stat"><small>Confirmadas</small><strong id="confirmadas">0</strong></div>
    <div class="stat"><small>Cursos diferentes</small><strong id="cursos">0</strong></div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Pesquisar por nome ou telefone">
      <select id="courseFilter"><option value="">Todos os cursos</option></select>
      <select id="statusFilter">
        <option value="">Todos os estados</option>
        <option>Nova</option><option>Contactado</option><option>Confirmado</option><option>Concluído</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Nome</th><th>Telefone</th><th>Curso</th><th>Estado</th><th>Ação</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" hidden>Nenhuma inscrição encontrada.</div>
    </div>
  </section>
</div>
<script>
const KEY='phedneckAcademyInscricoes';
const getData=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
const saveData=(data)=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const dateFmt=d=>{try{return new Date(d).toLocaleDateString('pt-AO')}catch{return d}};
function render(){
 const data=getData();
 const q=document.getElementById('search').value.toLowerCase();
 const cf=document.getElementById('courseFilter').value;
 const sf=document.getElementById('statusFilter').value;
 const courses=[...new Set(data.map(x=>x.curso).filter(Boolean))].sort();
 document.getElementById('courseFilter').innerHTML='<option value="">Todos os cursos</option>'+courses.map(c=>'<option '+(c===cf?'selected':'')+'>'+esc(c)+'</option>').join('');
 const filtered=data.filter(x=>(!q||(`${x.nome} ${x.telefone}`).toLowerCase().includes(q))&&(!cf||x.curso===cf)&&(!sf||x.estado===sf));
 document.getElementById('total').textContent=data.length;
 document.getElementById('novas').textContent=data.filter(x=>x.estado==='Nova').length;
 document.getElementById('confirmadas').textContent=data.filter(x=>x.estado==='Confirmado').length;
 document.getElementById('cursos').textContent=courses.length;
 const tbody=document.getElementById('tbody');
 tbody.innerHTML=filtered.map(x=>`<tr>
 <td>${dateFmt(x.data)}</td><td><strong>${esc(x.nome)}</strong></td><td>${esc(x.telefone)}</td><td>${esc(x.curso)}</td>
 <td><select class="status" data-id="${esc(x.id)}">${['Nova','Contactado','Confirmado','Concluído'].map(s=>`<option ${x.estado===s?'selected':''}>${s}</option>`).join('')}</select></td>
 <td><button class="delete" data-delete="${esc(x.id)}">Excluir</button></td></tr>`).join('');
 document.getElementById('empty').hidden=filtered.length>0;
}
document.addEventListener('change',e=>{
 if(e.target.matches('.status')){const data=getData();const x=data.find(a=>a.id===e.target.dataset.id);if(x){x.estado=e.target.value;saveData(data);render();}}
});
document.addEventListener('click',e=>{
 if(e.target.matches('[data-delete]')){if(confirm('Excluir esta inscrição?')){saveData(getData().filter(x=>x.id!==e.target.dataset.delete));render();}}
});
['search','courseFilter','statusFilter'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('clearBtn').onclick=()=>{if(getData().length&&confirm('Tem certeza que deseja apagar TODAS as inscrições?')){localStorage.removeItem(KEY);render();}};
document.getElementById('exportBtn').onclick=()=>{
 const data=getData(); if(!data.length){alert('Não existem inscrições para exportar.');return;}
 const rows=[['ID','Data','Nome','Telefone','Curso','Estado'],...data.map(x=>[x.id,x.data,x.nome,x.telefone,x.curso,x.estado])];
 const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='inscricoes-phedneck-academy.csv';a.click();URL.revokeObjectURL(a.href);
};
render();
</script>
</body>
</html>
